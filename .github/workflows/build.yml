name: Build deb

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src

      - name: Install dependencies
        run: brew install ldid make dpkg xz

      - name: Cache Theos
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: theos
          key: theos-${{ runner.os }}-v1

      - name: Set up Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          curl -sL https://github.com/theos/sdks/archive/master.tar.gz -o sdks.tar.gz
          tar -xzf sdks.tar.gz --strip-components=1 -C "$THEOS/sdks" 'sdks-master/iPhoneOS16.5.sdk'
          rm sdks.tar.gz
          ls "$THEOS/sdks"

      - name: Build package
        working-directory: src
        run: gmake package FINALPACKAGE=1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarSplash-deb
          path: src/packages/*.deb
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/packages/*.deb
